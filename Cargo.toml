[package]
name = "xmip-core-identify-jwt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-identify-jwt"
description = "Identify by jwt: reads a bearer token's subject, unverified, from the connection or from the content, with the token riding as proof for the second gate. A xmip-core-identify technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The token a property carries and the principal its
# claims name are the capability's (identify::jwt, ADR-0044); the mechanism
# is xmip-core's; the Message is the Foundation's, for the message layer this
# mechanism also travels on.
identify = { package = "xmip-core-identify", git = "https://github.com/IlleNilsson/xmip-core-identify", branch = "main" }
# The token itself, read as the estate's one JOSE reads it (jose::jwt), the
# same read the second gate verifies.
jose = { package = "xmip-core-library-jose", git = "https://github.com/IlleNilsson/xmip-core-library-jose", branch = "main" }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
message = { package = "xmip-core-message", git = "https://github.com/IlleNilsson/xmip-core-message", branch = "main" }
# The names the transport writes on the arrival (context::property), and
# the context a Message is built over.
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main" }

[dev-dependencies]
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }
# The estate's base64url, to mint tokens as an issuer would.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }

[lints]
workspace = true
