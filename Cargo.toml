# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-identify-jwt"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-identify-jwt"
description = "Identify by jwt: reads a bearer token's subject, unverified, from the connection or from the content, with the token riding as proof for the second gate. A xmip-core-identify technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The compact token reader is the capability's
# (identify::jwt, ADR-0044); the mechanism is xmip-core's; the Message is the
# Foundation's, for the message layer this mechanism also travels on.
identify = { package = "xmip-core-identify", git = "https://github.com/IlleNilsson/xmip-core-identify", branch = "main" }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
message = { package = "xmip-core-message", git = "https://github.com/IlleNilsson/xmip-core-message", branch = "main" }

[dev-dependencies]
# The tests mint tokens (base64url, RFC 7515) and build Messages.
base64 = "0.22"
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main" }
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
